<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSI 服務戰情系統｜裕信汽車服務部</title>
<script>(function(){var t=null;try{t=localStorage.getItem('csi-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}
document.documentElement.setAttribute('data-theme',t)})();</script>
<style>
:root, :root[data-theme="dark"]{
  color-scheme: dark;
  --bg0:#0a1020; --bg1:#0e1733;
  --glow1:#12275c; --glow2:#102250;
  --card:#131c37; --card2:#0e1630;
  --border:rgba(255,255,255,.09);
  --ink:#eaeefa; --ink2:#aab3d1; --muted:#8b95b8;
  --axis:#8b95b8; --grid:rgba(255,255,255,.07);
  --ov:rgba(255,255,255,.06); --hover:rgba(255,255,255,.035); --track:rgba(255,255,255,.07);
  --teal:#2dd4bf; --cyan:#3cc8f0; --on-accent:#04231f;
  --glow:rgba(45,212,191,.30); --strong-bg:rgba(45,212,191,.08);
  --good:#34d399; --warn:#fbbf24; --bad:#ff7b7b;
  --good-bg:rgba(52,211,153,.14); --warn-bg:rgba(251,191,36,.14); --bad-bg:rgba(255,123,123,.16);
  --good-bd:rgba(52,211,153,.38);
  --purple:#c58af0;
  --c1:#2dd4bf; --c2:#5b9cf5; --c3:#f2b33d; --c4:#c58af0; --c5:#f472a8; --c6:#fb923c; --c7:#94a0c4;
  --s1:#f87171; --s2:#fb923c; --s3:#fbbf24; --s4:#a3e635; --s5:#34d399;
  --hdr-bg:rgba(10,16,32,.92); --fb-bg:rgba(8,13,28,.85); --nav-bg:rgba(6,10,24,.72);
  --logo-bg:radial-gradient(circle at 35% 30%, #1d2d5c, #0b1330);
  --kpi-hi:linear-gradient(180deg,#261c48,#161030); --kpi-hi-bd:rgba(197,138,240,.38);
  --shadow:0 6px 20px rgba(0,0,0,.28); --scroll:#2a3a73;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg0:#f3f6fb; --bg1:#e8eef8;
  --glow1:#dce8ff; --glow2:#e3ecff;
  --card:#ffffff; --card2:#f5f8fd;
  --border:rgba(20,35,80,.12);
  --ink:#121c38; --ink2:#46527a; --muted:#64708f;
  --axis:#64708f; --grid:rgba(20,35,80,.10);
  --ov:rgba(20,35,80,.06); --hover:rgba(20,35,80,.04); --track:rgba(20,35,80,.09);
  --teal:#0e8a7d; --cyan:#0b7fc0; --on-accent:#ffffff;
  --glow:rgba(14,138,125,.22); --strong-bg:rgba(14,138,125,.09);
  --good:#0a7f5a; --warn:#a16207; --bad:#c62828;
  --good-bg:rgba(5,150,105,.12); --warn-bg:rgba(202,138,4,.15); --bad-bg:rgba(220,38,38,.10);
  --good-bd:rgba(5,150,105,.35);
  --purple:#6d28d9;
  --c1:#0e8a7d; --c2:#2563eb; --c3:#c2860a; --c4:#9333ea; --c5:#db2777; --c6:#ea580c; --c7:#64748b;
  --s1:#dc2626; --s2:#ea580c; --s3:#ca8a04; --s4:#65a30d; --s5:#059669;
  --hdr-bg:rgba(255,255,255,.90); --fb-bg:rgba(244,247,253,.94); --nav-bg:rgba(236,241,250,.92);
  --logo-bg:radial-gradient(circle at 35% 30%, #ffffff, #d9e6fb);
  --kpi-hi:linear-gradient(180deg,#f3ecff,#e7dcff); --kpi-hi-bd:rgba(124,58,237,.30);
  --shadow:0 4px 16px rgba(30,50,100,.09); --scroll:#b8c3dc;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 10% -10%, var(--glow1) 0%, transparent 60%),
             radial-gradient(1000px 500px at 100% 0%, var(--glow2) 0%, transparent 55%),
             linear-gradient(180deg,var(--bg0),var(--bg1) 60%,var(--bg0));
  color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px;}
a{color:var(--cyan);}

/* ---------- header ---------- */
.header{
  position:sticky; top:0; z-index:50;
  background:var(--hdr-bg);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:10px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:220px;}
.brand .logo{
  width:40px;height:40px;border-radius:50%;
  background:var(--logo-bg);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  border:1px solid var(--border);
  box-shadow:0 0 18px var(--glow) inset;
}
.brand .name{font-size:17px;font-weight:800;letter-spacing:.5px;}
.brand .sub{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:1px;}
.header-kpis{
  display:flex; gap:22px; flex-wrap:wrap; flex:1; justify-content:center;
}
.hkpi{text-align:center;min-width:78px;}
.hkpi b{display:block;font-size:16px;font-weight:800;color:var(--teal);}
.hkpi span{font-size:10.5px;color:var(--muted);}
.header-right{display:flex;align-items:center;gap:12px;}
.clock{text-align:right;font-size:12px;color:var(--ink2);}
.clock b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;}
.live{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--good-bg); color:var(--good);
  border:1px solid var(--good-bd);
  padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.5px;
}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:.25;}100%{opacity:1;}}

.theme-btn{background:var(--card2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;}
.theme-btn:hover{border-color:var(--teal);color:var(--teal);}
.dealer-seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.dealer-seg button{
  background:transparent;border:none;color:var(--ink2);padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600;
}
.dealer-seg button.active{background:var(--teal);color:var(--on-accent);}

/* ---------- filter bar ---------- */
.filterbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 20px; background:var(--fb-bg); border-bottom:1px solid var(--border);
  font-size:12.5px; color:var(--ink2);
}
.fb-label{font-weight:700; color:var(--ink);}
.fb-item{display:flex; align-items:center; gap:6px;}
.filterbar select{
  background:var(--card2); border:1px solid var(--border); color:var(--ink);
  padding:5px 9px; border-radius:7px; font-size:12px;
}
.filterbar button{
  background:transparent; border:1px solid var(--border); color:var(--ink2);
  padding:5px 12px; border-radius:7px; font-size:12px; cursor:pointer;
}
.filterbar button:hover{color:var(--teal); border-color:var(--teal);}
.fb-current{margin-left:auto; color:var(--teal); font-weight:700; font-size:12px;}

/* ---------- nav tabs ---------- */
.navtabs{
  display:flex; gap:4px; overflow-x:auto; padding:8px 16px;
  background:var(--nav-bg); border-bottom:1px solid var(--border);
  position:sticky; top:62px; z-index:40;
}
.navtabs::-webkit-scrollbar{height:0;}
.navtab{
  white-space:nowrap; padding:8px 16px; border-radius:8px; cursor:pointer;
  color:var(--ink2); font-size:13px; font-weight:700; border:1px solid transparent;
}
.navtab.active{
  color:var(--on-accent); background:linear-gradient(135deg,var(--teal),var(--cyan));
  box-shadow:0 0 16px var(--glow);
}
.navtab:not(.active):hover{background:var(--card2); color:var(--ink);}

main{padding:18px 20px 60px; max-width:1500px; margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{
  background:linear-gradient(180deg, var(--card), var(--card2));
  border:1px solid var(--border); border-radius:14px; padding:16px 18px;
  box-shadow:var(--shadow);
}
.card h3{margin:0 0 10px; font-size:14px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.card h3 .tag{margin-left:auto; font-size:10.5px; color:var(--muted); font-weight:400; background:var(--ov); padding:3px 8px; border-radius:20px;}

.kpi{text-align:center; padding:18px 10px;}
.kpi .ic{font-size:22px;}
.kpi .num{font-size:26px; font-weight:800; margin-top:4px; color:var(--teal); font-variant-numeric:tabular-nums;}
.kpi .lbl{font-size:11.5px; color:var(--ink2); margin-top:2px;}
.kpi.purple{background:var(--kpi-hi); border-color:var(--kpi-hi-bd);}
.kpi.purple .num{color:var(--purple);}

.barrow{display:flex; align-items:center; gap:10px; margin:12px 0;}
.barrow .lbl{width:118px; font-size:12.5px; color:var(--ink2); flex-shrink:0;}
.barrow .track{flex:1; height:16px; background:var(--ov); border-radius:8px; overflow:hidden; position:relative;}
.barrow .fill{height:100%; border-radius:8px; background:linear-gradient(90deg,var(--teal),var(--cyan));}
.barrow .val{width:56px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; font-size:12.5px;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{padding:8px 10px; text-align:center; border-bottom:1px solid var(--border); white-space:nowrap;}
th{color:var(--ink2); font-weight:700; position:sticky; top:0; background:var(--card); cursor:pointer; user-select:none;}
th.sortable:hover{color:var(--teal);}
tbody tr:hover{background:var(--hover);}
.tablewrap{overflow-x:auto;}
td.name{text-align:left;}
.medal{font-size:15px;}
.rank-badge{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--ov);font-size:11px;font-weight:800;}

.score-good{color:var(--good); font-weight:700;}
.score-warn{color:var(--warn); font-weight:700;}
.score-bad{color:var(--bad); font-weight:700;}
.pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700;}
.pill.good{background:var(--good-bg); color:var(--good);}
.pill.warn{background:var(--warn-bg); color:var(--warn);}
.pill.bad{background:var(--bad-bg); color:var(--bad);}

.chart-wrap{position:relative; height:280px;}
.chart-wrap.tall{height:340px;}
.chart-wrap.short{height:220px;}

.searchbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.searchbar input[type=text]{
  flex:1; min-width:220px; background:var(--card2); border:1px solid var(--border); color:var(--ink);
  padding:10px 14px; border-radius:10px; font-size:13px;
}
.searchbar select{background:var(--card2); border:1px solid var(--border); color:var(--ink); padding:10px 12px; border-radius:10px; font-size:13px;}
.searchbar button{
  background:linear-gradient(135deg,var(--teal),var(--cyan)); border:none; color:var(--on-accent); font-weight:800;
  padding:10px 22px; border-radius:10px; cursor:pointer; font-size:13px;
}
.searchbar button:hover{filter:brightness(1.08);}

.plate-badge{font-size:22px; font-weight:800; background:var(--card2); border:1px solid var(--border); padding:8px 18px; border-radius:10px; letter-spacing:1px;}
.warn-tag{background:var(--bad-bg); color:var(--bad); padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.up{color:var(--good); font-weight:700;}
.down{color:var(--bad); font-weight:700;}
.flat{color:var(--muted);}

.empty{text-align:center; color:var(--muted); padding:40px 0;}
.pagerow{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:12px; font-size:12.5px; color:var(--ink2);}
.pagerow button{background:var(--card2); border:1px solid var(--border); color:var(--ink); padding:6px 14px; border-radius:8px; cursor:pointer;}
.pagerow button:disabled{opacity:.35; cursor:default;}
.voc-tag{padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700;}
.voc-text-cell{max-width:340px; white-space:normal; text-align:left;}

.plant-cardwall{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@media (max-width:1100px){.plant-cardwall{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.plant-cardwall{grid-template-columns:1fr;}}
.plant-card{background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:14px;}
.plant-card .pc-top{display:flex; align-items:center; justify-content:space-between;}
.plant-card .pc-name{font-weight:800; font-size:13.5px;}
.plant-card .pc-score{font-size:24px; font-weight:800; color:var(--teal); margin:6px 0 2px;}
.plant-card .pc-meta{font-size:11px; color:var(--ink2);}
.plant-card .track{margin-top:8px; height:8px; border-radius:6px; background:var(--ov); overflow:hidden;}
.plant-card .track .fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--cyan));}

.threshold-note{font-size:11px; color:var(--muted); margin-bottom:8px;}
footer.foot{text-align:center; color:var(--muted); font-size:11.5px; padding:30px 0 10px;}

/* ---------- login gate ---------- */
.auth-gate{position:fixed; inset:0; z-index:500; display:none; align-items:center; justify-content:center; padding:20px; overflow:auto;
  background:radial-gradient(1200px 600px at 10% -10%, var(--glow1) 0%, transparent 60%), linear-gradient(180deg,var(--bg0),var(--bg1));}
.auth-box{width:100%; max-width:380px; background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--border);
  border-radius:16px; padding:26px 24px; box-shadow:var(--shadow);}
.auth-head{text-align:center; margin-bottom:18px;}
.auth-logo{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--logo-bg);border:1px solid var(--border);}
.auth-title{font-size:19px; font-weight:800; color:var(--ink);}
.auth-sub{font-size:12.5px; color:var(--muted); margin-top:3px;}
.auth-input{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; background:var(--card2); color:var(--ink); font-size:14px; margin-bottom:10px; font-family:inherit;}
.auth-input:focus{outline:2px solid var(--teal); outline-offset:1px;}
.auth-btn{width:100%; padding:11px; border:none; border-radius:9px; background:linear-gradient(135deg,var(--teal),var(--cyan)); color:var(--on-accent); font-weight:800; font-size:14px; cursor:pointer; font-family:inherit;}
.auth-btn:disabled{opacity:.6; cursor:default;}
.auth-cancel{width:100%; margin-top:8px; padding:9px; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--ink2); cursor:pointer; font-family:inherit;}
.auth-err{color:var(--bad); font-size:12.5px; min-height:18px; margin:2px 0 8px;}
.auth-note{font-size:11.5px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.6;}
.auth-warn{background:var(--warn-bg); color:var(--warn); border-radius:9px; padding:9px 11px; font-size:12.5px; margin-bottom:12px; line-height:1.6;}
.user-chip{font-size:12px; color:var(--ink2); white-space:nowrap;}
#userMenu{display:flex; align-items:center; gap:8px;}
</style>
</head>
<body>
<div id="authGate" class="auth-gate"></div>
<div id="appRoot" style="display:none">

<div class="header">
  <div class="brand">
    <div class="logo">📡</div>
    <div>
      <div class="name">CSI 服務戰情系統</div>
      <div class="sub">CUSTOMER SATISFACTION INDEX · COMMAND CENTER</div>
    </div>
  </div>
  <div class="header-kpis" id="headerKpis"></div>
  <div class="header-right">
    <div class="dealer-seg" id="dealerSeg">
      <button data-d="all" class="active">全部</button>
      <button data-d="裕信">裕信</button>
      <button data-d="裕信-2">裕信-2</button>
    </div>
    <span id="userMenu"></span>
    <button class="theme-btn" id="themeBtn" title="切換淺色／深色模式"></button>
    <div class="clock">
      <b id="clockTime">--:--:--</b>
      <span id="clockDate">----/--/-- (-)</span>
    </div>
    <div class="live"><span class="dot"></span>LIVE</div>
  </div>
</div>

<div class="filterbar">
  <span class="fb-label">🔎 篩選：</span>
  <span class="fb-item">廠區
    <select id="fPlant"><option value="all">全部廠區</option></select>
  </span>
  <span class="fb-item">起
    <select id="fFrom"></select>
  </span>
  <span class="fb-item">訖
    <select id="fTo"></select>
  </span>
  <button id="fReset">重設篩選</button>
  <span class="fb-current" id="fCurrent"></span>
</div>

<div class="navtabs" id="navtabs"></div>

<main id="main">
  <section class="tab-panel" id="tab-overview"></section>
  <section class="tab-panel" id="tab-monthly"></section>
  <section class="tab-panel" id="tab-plant"></section>
  <section class="tab-panel" id="tab-advisor"></section>
  <section class="tab-panel" id="tab-tech"></section>
  <section class="tab-panel" id="tab-plate"></section>
  <section class="tab-panel" id="tab-voc"></section>
  <section class="tab-panel" id="tab-paint"></section>
  <section class="tab-panel" id="tab-warranty"></section>
  <section class="tab-panel" id="tab-insights"></section>
  <section class="tab-panel" id="tab-official"></section>
</main>

<footer class="foot">CSI 服務戰情系統 · 資料範圍 <span id="footRange"></span> · 產生時間 <span id="footGen"></span></footer>
</div><!-- /appRoot -->

<script>
window.__csiStart = function(){
"use strict";

const PAL = {};
function loadPalette(){
  const cs = getComputedStyle(document.documentElement);
  ['c1','c2','c3','c4','c5','c6','c7','s1','s2','s3','s4','s5','good','warn','bad'].forEach(k=>{ PAL[k] = cs.getPropertyValue('--'+k).trim(); });
}
loadPalette();
const DIMS = [
  {k:'o', label:'整體滿意度', icon:'⭐', get color(){return PAL.c1}},
  {k:'r', label:'保修處理',   icon:'🔧', get color(){return PAL.c2}},
  {k:'k', label:'結帳服務',   icon:'💳', get color(){return PAL.c3}},
  {k:'x', label:'交修說明',   icon:'🗣️', get color(){return PAL.c4}},
  {k:'l', label:'客休室',     icon:'🛋️', get color(){return PAL.c5}},
];
const RAW = (window.CSI_DATA && window.CSI_DATA.records) || [];
const META = (window.CSI_DATA && window.CSI_DATA.meta) || {};
const MONTHS = (META.months||[]).slice().sort();

function fmtYM(ym){ if(!ym) return ''; return ym.slice(0,4)+'/'+ym.slice(4,6); }
function fmtYM2(ym){ if(!ym) return ''; return ym.slice(2,4)+'/'+ym.slice(4,6); }
function fmt2(n){ return (n==null || isNaN(n)) ? '—' : Number(n).toFixed(2); }
function fmt3(n){ return (n==null || isNaN(n)) ? '—' : Number(n).toFixed(3); }
function pct(n,d){ return d? (100*n/d).toFixed(1)+'%' : '0.0%'; }
function scoreClass(v){
  if(v==null) return '';
  if(v>=4.95) return 'score-good';
  if(v>=4.85) return 'score-warn';
  return 'score-bad';
}
function pillClass(v){
  if(v==null) return 'pill';
  if(v>=4.95) return 'pill good';
  if(v>=4.85) return 'pill warn';
  return 'pill bad';
}
function mean(arr, key){
  let s=0,n=0;
  for(const r of arr){ const v=r[key]; if(v!=null){ s+=v; n++; } }
  return n? s/n : null;
}
function dimStats(arr){
  const out = {count: arr.length};
  DIMS.forEach(d=> out[d.k] = mean(arr, d.k));
  out.g = mean(arr, 'g');
  return out;
}
function groupBy(arr, keyFn){
  const m = new Map();
  for(const r of arr){
    const k = keyFn(r);
    if(k==null) continue;
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return m;
}
function medal(i){ return i===0?'🥇':i===1?'🥈':i===2?'🥉':''; }

// ---------------- state ----------------
const state = { dealer: 'all', plant: 'all', monthFrom: MONTHS[0], monthTo: MONTHS[MONTHS.length-1] };
function dataset(){
  return RAW.filter(r=>{
    if(state.dealer !== 'all' && r.d !== state.dealer) return false;
    if(state.plant !== 'all' && r.f !== state.plant) return false;
    if(r.y < state.monthFrom || r.y > state.monthTo) return false;
    return true;
  });
}

// ---------------- lightweight SVG/CSS chart engine (no external deps) ----------------
const SVGNS = "http://www.w3.org/2000/svg";
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function niceTicks(min,max,n=4){
  const arr=[]; for(let i=0;i<=n;i++) arr.push(min + (max-min)*i/n);
  return arr;
}
function legendHtml(items){
  return `<div style="display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--ink2);margin-bottom:8px;">${
    items.map(it=>`<span style="display:inline-flex;align-items:center;gap:5px;"><i style="width:9px;height:9px;border-radius:2px;background:${it.color};display:inline-block;"></i>${esc(it.label)}</span>`).join('')
  }</div>`;
}
function axisValLabel(v, isCount){ return isCount? Math.round(v).toLocaleString() : v.toFixed(2); }

function drawLineChart(id, {labels, series, min, max, isCount=false, showLegend=true}){
  const host = document.getElementById(id); if(!host) return;
  const legend = showLegend ? legendHtml(series.map(s=>({label:s.label,color:s.color}))) : '';
  const legendH = showLegend ? 24 : 0;
  const w = Math.max(host.clientWidth||600, 300), h = Math.max((host.clientHeight||260)-legendH, 140);
  const padL=44,padR=16,padT=12,padB=26;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n = labels.length;
  const x = i=> n<=1? padL+plotW/2 : padL + i*(plotW/(n-1));
  const y = v=> padT + (1-((v-min)/(max-min||1)))*plotH;
  const ticks = niceTicks(min,max,4);
  let grid='';
  ticks.forEach(t=>{
    const yy=y(t);
    grid += `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" style="stroke:var(--grid)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="10" style="fill:var(--axis)">${axisValLabel(t,isCount)}</text>`;
  });
  const step = Math.max(1, Math.ceil(n/8));
  let xlabels='';
  labels.forEach((lb,i)=>{ if(i%step===0 || i===n-1) xlabels += `<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="10" style="fill:var(--axis)">${esc(lb)}</text>`; });
  let paths='';
  series.forEach(s=>{
    let d=''; let pts='';
    s.data.forEach((v,i)=>{
      if(v==null){ return; }
      const px=x(i), py=y(Math.max(min,Math.min(max,v)));
      d += (d===''||s.data[i-1]==null) ? `M${px},${py} ` : `L${px},${py} `;
      pts += `<circle cx="${px}" cy="${py}" r="2.4" fill="${s.color}"/>`;
    });
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts}`;
  });
  host.innerHTML = legend + `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="${SVGNS}">${grid}${paths}${xlabels}</svg>`;
}

function drawBarChart(id, {labels, values, color, isCount=true}){
  const host = document.getElementById(id); if(!host) return;
  const w = Math.max(host.clientWidth||600, 300), h = Math.max(host.clientHeight||260, 140);
  const padL=44,padR=16,padT=12,padB=26;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n = values.length;
  const max = Math.max(...values,1) * 1.15;
  const gap = plotW/n*0.28;
  const bw = plotW/n - gap;
  const y = v=> padT + (1-(v/max))*plotH;
  const ticks = niceTicks(0,max,4);
  let grid='';
  ticks.forEach(t=>{
    const yy=y(t);
    grid += `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" style="stroke:var(--grid)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="10" style="fill:var(--axis)">${axisValLabel(t,isCount)}</text>`;
  });
  const step = Math.max(1, Math.ceil(n/8));
  let bars='', xlabels='';
  values.forEach((v,i)=>{
    const bx = padL + i*(plotW/n) + gap/2;
    const by = y(v);
    bars += `<rect x="${bx}" y="${by}" width="${bw}" height="${padT+plotH-by}" rx="3" fill="${color}"/>`;
    if(i%step===0 || i===n-1) xlabels += `<text x="${bx+bw/2}" y="${h-6}" text-anchor="middle" font-size="10" style="fill:var(--axis)">${esc(labels[i])}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="${SVGNS}">${grid}${bars}${xlabels}</svg>`;
}

function drawGroupedBarChart(id, {labels, series, min, max}){
  const host = document.getElementById(id); if(!host) return;
  const legend = legendHtml(series.map(s=>({label:s.label,color:s.color})));
  const w = Math.max(host.clientWidth||600, 300), h = Math.max((host.clientHeight||300)-24, 160);
  const padL=44,padR=16,padT=12,padB=54;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n = labels.length, sN = series.length;
  const groupW = plotW/n;
  const barW = groupW*0.8/sN;
  const y = v=> padT + (1-((v-min)/(max-min||1)))*plotH;
  const ticks = niceTicks(min,max,4);
  let grid='';
  ticks.forEach(t=>{
    const yy=y(t);
    grid += `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" style="stroke:var(--grid)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="10" style="fill:var(--axis)">${axisValLabel(t,false)}</text>`;
  });
  let bars='', xlabels='';
  labels.forEach((lb,gi)=>{
    const gx = padL + gi*groupW + groupW*0.1;
    series.forEach((s,si)=>{
      const v = s.data[gi];
      if(v==null) return;
      const bx = gx + si*barW;
      const by = y(Math.max(min,Math.min(max,v)));
      bars += `<rect x="${bx}" y="${by}" width="${barW*0.85}" height="${padT+plotH-by}" rx="2" fill="${s.color}"/>`;
    });
    const cx = padL + gi*groupW + groupW/2;
    xlabels += `<text x="${cx}" y="${h-padB+16}" text-anchor="end" font-size="10" style="fill:var(--axis)" transform="rotate(-40 ${cx} ${h-padB+16})">${esc(lb)}</text>`;
  });
  host.innerHTML = legend + `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="${SVGNS}">${grid}${bars}${xlabels}</svg>`;
}

function drawHBarChart(id, {labels, values, color, min=0, max, isCount=false}){
  const host = document.getElementById(id); if(!host) return;
  const n = labels.length;
  const rowH = 24;
  const w = Math.max(host.clientWidth||600, 300);
  const h = Math.max(n*rowH + 20, 60);
  host.style.height = h+'px';
  const padL=130,padR=48,padT=6;
  const plotW=w-padL-padR;
  const mx = max!=null? max : Math.max(...values,1)*1.05;
  const x = v=> padL + ((v-min)/((mx-min)||1))*plotW;
  let bars='';
  values.forEach((v,i)=>{
    const yy = padT + i*rowH;
    const bx = x(Math.max(min,v));
    const c = Array.isArray(color) ? (color[i]||PAL.c1) : color;
    const label = (typeof v==='number')? (isCount? Math.round(v).toLocaleString() : v.toFixed(3)) : v;
    bars += `<text x="${padL-8}" y="${yy+rowH*0.62}" text-anchor="end" font-size="11" style="fill:var(--ink2)">${esc(labels[i])}</text>`;
    bars += `<rect x="${padL}" y="${yy+4}" width="${Math.max(2,bx-padL)}" height="${rowH-9}" rx="3" fill="${c}"/>`;
    bars += `<text x="${bx+6}" y="${yy+rowH*0.62}" font-size="11" style="fill:var(--ink)" font-weight="700">${label}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="${SVGNS}">${bars}</svg>`;
}

function drawDonut(id, segments){
  const host = document.getElementById(id); if(!host) return;
  const total = segments.reduce((s,x)=>s+x.count,0) || 1;
  let acc=0;
  const stops = segments.map(s=>{
    const start=acc/total*360; acc+=s.count; const end=acc/total*360;
    return `${s.color} ${start}deg ${end}deg`;
  }).join(', ');
  const legend = segments.map(s=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0;">
    <i style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block;flex-shrink:0;"></i>
    <span style="flex:1;color:var(--ink2);">${esc(s.label)}</span>
    <b>${s.count.toLocaleString()}</b>
    <span style="color:var(--muted);width:52px;text-align:right;">${pct(s.count,total)}</span>
  </div>`).join('');
  host.innerHTML = `
    <div style="display:flex;align-items:center;gap:22px;height:100%;">
      <div style="position:relative;width:150px;height:150px;flex-shrink:0;">
        <div style="width:100%;height:100%;border-radius:50%;background:conic-gradient(${stops});"></div>
        <div style="position:absolute;inset:24px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
          <b style="font-size:18px;">${total.toLocaleString()}</b><span style="font-size:9.5px;color:var(--muted);">總筆數</span>
        </div>
      </div>
      <div style="flex:1;min-width:0;">${legend}</div>
    </div>`;
}

  const overallAvg = mean(ds,'g');
  const perfect = ds.filter(r=> r.g!=null && r.g>=4.999).length;

  const range = fmtYM(state.monthFrom)+'–'+fmtYM(state.monthTo);
  document.getElementById('headerKpis').innerHTML = `
    <div class="hkpi"><b>${total.toLocaleString()}</b><span>累計筆數</span></div>
    <div class="hkpi"><b>${fmt3(overallAvg)}</b><span>整體均分</span></div>
    <div class="hkpi"><b>${perfectRate}</b><span>滿分率</span></div>
    <div class="hkpi"><b>${range}</b><span>資料期間</span></div>
  `;
  const fullRange = MONTHS.length? fmtYM(MONTHS[0])+'–'+fmtYM(MONTHS[MONTHS.length-1]) : '—';
  document.getElementById('footRange').textContent = fullRange;
  document.getElementById('footGen').textContent = META.generated_at || '';

  if(state.plant!=='all') bits.push('廠區：'+state.plant);
  if(state.monthFrom!==MONTHS[0] || state.monthTo!==MONTHS[MONTHS.length-1]) bits.push('月份：'+range);
  document.getElementById('fCurrent').textContent = bits.length? ('已篩選 — '+bits.join('　')) : '顯示全部資料';
}

// ================= FILTER BAR =================
function buildFilterBar(){
  const plants = Array.from(new Set(RAW.map(r=>r.f))).sort();
  const plantSel = document.getElementById('fPlant');
  plants.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; plantSel.appendChild(o); });
  const fromSel = document.getElementById('fFrom'), toSel = document.getElementById('fTo');
  MONTHS.forEach(m=>{
    const o1=document.createElement('option'); o1.value=m; o1.textContent=fmtYM(m); fromSel.appendChild(o1);
    const o2=document.createElement('option'); o2.value=m; o2.textContent=fmtYM(m); toSel.appendChild(o2);
  });
  fromSel.value = state.monthFrom; toSel.value = state.monthTo;

  function applyAndRerender(){
    renderHeader();
    const t = TABS.find(t=>t.id===currentTab);
    if(t) t.render();
  }
  plantSel.addEventListener('change', ()=>{ state.plant = plantSel.value; applyAndRerender(); });
  fromSel.addEventListener('change', ()=>{
    state.monthFrom = fromSel.value;
    if(state.monthFrom > state.monthTo){ state.monthTo = state.monthFrom; toSel.value = state.monthTo; }
    applyAndRerender();
  });
  toSel.addEventListener('change', ()=>{
    state.monthTo = toSel.value;
    if(state.monthTo < state.monthFrom){ state.monthFrom = state.monthTo; fromSel.value = state.monthFrom; }
    applyAndRerender();
  });
  document.getElementById('fReset').addEventListener('click', ()=>{
    state.plant='all'; state.monthFrom=MONTHS[0]; state.monthTo=MONTHS[MONTHS.length-1];
    plantSel.value='all'; fromSel.value=state.monthFrom; toSel.value=state.monthTo;
    applyAndRerender();
  });
}

// ================= TAB 2: MONTHLY =================
const moCtl = { metric:'g', cat:'all' };
const MO_METRICS = [
  {k:'g', label:'均總分'}, {k:'o', label:'整體滿意度'}, {k:'r', label:'保修處理'},
  {k:'k', label:'結帳服務'}, {k:'x', label:'交修說明'}, {k:'l', label:'客休室'}, {k:'count', label:'進廠筆數'},
];
function autoRange(valueLists, pad=0.02){
  let mn=Infinity, mx=-Infinity;
  valueLists.forEach(a=>a.forEach(v=>{ if(v!=null){ if(v<mn) mn=v; if(v>mx) mx=v; } }));
  if(!isFinite(mn)) return {min:3.5, max:5};
  mn = Math.max(0, Math.floor((mn-pad)*20)/20);
  mx = Math.min(5, Math.ceil((mx+0.005)*20)/20);
  if(mx-mn < 0.1) mn = Math.max(0, mx-0.1);
  return {min:mn, max:mx};
}
function heatStyle(v, metric){
  if(v==null) return '';
  if(metric==='count') return '';
  if(v>=4.95) return 'background:var(--good-bg);color:var(--good);';
  if(v>=4.85) return 'background:var(--warn-bg);color:var(--warn);';
  return 'background:var(--bad-bg);color:var(--bad);';
}
function drawMoMatrix(){
  const host = document.getElementById('moMatrix'); if(!host) return;
  let ds = dataset();
  if(moCtl.cat!=='all') ds = ds.filter(r=>r.c===moCtl.cat);
  const months = MONTHS.filter(m=> m>=state.monthFrom && m<=state.monthTo);
  const metric = moCtl.metric, isCount = metric==='count';
  const val = arr => isCount ? arr.length : mean(arr, metric);
  const fmtV = v => v==null ? '<span style="color:var(--muted)">—</span>' : (isCount ? v.toLocaleString() : v.toFixed(3));
  const byPlant = groupBy(ds, r=>r.f);
  const plants = Array.from(byPlant.keys()).sort((a,b)=>{
    const va = val(byPlant.get(a)), vb = val(byPlant.get(b));

function renderPlateTab(){
  const el = document.getElementById('tab-plate');
  el.innerHTML = `
    <div class="card">

      <div class="searchbar">

        <button id="plateBtn">查詢</button>
      </div>
      <div id="plateResult"></div>
    </div>
  `;
  const input = document.getElementById('plateInput');
  const btn = document.getElementById('plateBtn');
  const go = ()=> doPlateSearch(input.value.trim());
  btn.addEventListener('click', go);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}
function doPlateSearch(q){
  const box = document.getElementById('plateResult');
  if(!q){ box.innerHTML=''; return; }
  const ds = dataset();
  const norm = s => (s||'').toUpperCase().replace(/\s/g,'');
  const hits = ds.filter(r=> norm(r.p) === norm(q));
  if(!hits.length){
    box.innerHTML = `<div class="empty">查無「${q}」的進廠紀錄</div>`;
    return;
  }
  hits.sort((a,b)=> (a.e||'').localeCompare(b.e||''));
  const stats = dimStats(hits);
  const last = hits[hits.length-1];
  const prev = hits.length>1 ? hits[hits.length-2] : null;
  const declining = prev && last.g!=null && prev.g!=null && last.g < prev.g;

  let rowsHtml = '';
  hits.forEach((r,i)=>{
    const p = i>0? hits[i-1] : null;
    const deltaCell = (key)=>{
      if(!p || r[key]==null || p[key]==null) return '<span class="flat">—</span>';
      const diff = +(r[key]-p[key]).toFixed(2);
      if(diff>0) return `<span class="up">▲${diff.toFixed(2)}</span>`;
      if(diff<0) return `<span class="down">▼${Math.abs(diff).toFixed(2)}</span>`;
      return '<span class="flat">持平</span>';
    };
    rowsHtml += `<tr>
      <td>${i+1}</td><td>${fmtYM(r.y)}</td><td class="name">${r.f}</td><td>${r.e||'—'}</td>
      <td><span class="${pillClass(r.g)}">${fmt3(r.g)}</span></td>
      <td class="${scoreClass(r.o)}">${fmt3(r.o)}<br>${deltaCell('o')}</td>
      <td class="${scoreClass(r.r)}">${fmt3(r.r)}<br>${deltaCell('r')}</td>
      <td class="${scoreClass(r.k)}">${fmt3(r.k)}<br>${deltaCell('k')}</td>
      <td class="${scoreClass(r.x)}">${fmt3(r.x)}<br>${deltaCell('x')}</td>
      <td class="${scoreClass(r.l)}">${fmt3(r.l)}<br>${deltaCell('l')}</td>
    </tr>`;
  });

  box.innerHTML = `
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:14px 0;">
      <div class="plate-badge">${last.p}</div>
      <span class="pill good">共 ${hits.length} 次進廠</span>
      ${declining? '<span class="warn-tag">📉 分數下滑</span>' : ''}
    </div>
    <div class="grid grid-4">
      <div class="card kpi"><div class="num">${fmt3(stats.o)}</div><div class="lbl">整體均分</div></div>
      <div class="card kpi"><div class="num">${fmt3(stats.r)}</div><div class="lbl">保修處理均分</div></div>
      <div class="card kpi"><div class="num">${fmt3(stats.k)}</div><div class="lbl">結帳服務均分</div></div>
      <div class="card kpi"><div class="num">${fmt3(stats.x)}</div><div class="lbl">交修說明均分</div></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>📋 歷次進廠明細（分數旁為與上一次比較）</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>次序</th><th>年月</th><th>服務廠</th><th>出廠日期</th><th>均總分</th><th>整體</th><th>保修</th><th>結帳</th><th>交修</th><th>客休</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>
    </div>
  `;
}

    '車載系統/導航':PAL.c1,'等待時間/準時':PAL.c5,'溝通/說明':PAL.good,'設施/環境硬體':PAL.c6,'其他建議':PAL.c7};
  drawHBarChart('voc-bars', { labels: cats.map(c=>c.cat), values: cats.map(c=>c.count),
    color: cats.map(c=>catColors[c.cat]||PAL.c1), min:0, isCount:true });

  vocPage = 1;
  vocFilters = {plant:'all', cat:'all', month:'all', kw:''};
  ['vocPlant','vocCat','vocMonth'].forEach(id=>{
    document.getElementById(id).addEventListener('change', e=>{
      vocFilters[id.replace('voc','').toLowerCase()] = e.target.value;
      vocPage = 1; drawVocTable(vocAll);
    });
  });
  document.getElementById('vocKw').addEventListener('input', e=>{ vocFilters.kw = e.target.value; vocPage=1; drawVocTable(vocAll); });
  drawVocTable(vocAll);
}
function drawVocTable(vocAll){
  let rows = vocAll;
  if(vocFilters.plant!=='all') rows = rows.filter(r=>r.f===vocFilters.plant);
  if(vocFilters.cat!=='all') rows = rows.filter(r=>r.vc===vocFilters.cat);
  if(vocFilters.month!=='all') rows = rows.filter(r=>r.y===vocFilters.month);
  if(vocFilters.kw) rows = rows.filter(r=> (r.v||'').includes(vocFilters.kw));
  rows = rows.slice().sort((a,b)=> (b.e||'').localeCompare(a.e||''));

  const totalPages = Math.max(1, Math.ceil(rows.length / VOC_PAGE_SIZE));
  vocPage = Math.min(vocPage, totalPages);
  const start = (vocPage-1)*VOC_PAGE_SIZE;
  const pageRows = rows.slice(start, start+VOC_PAGE_SIZE);

  document.getElementById('vocTableWrap').innerHTML = `
    <div class="tablewrap"><table>
      <thead><tr><th>月份</th><th>車牌</th><th>廠區</th><th>服務顧問</th><th>分類</th><th>客戶回饋內容</th></tr></thead>
      <tbody>${pageRows.map(r=>`<tr>
        <td>${fmtYM(r.y)}</td><td>${r.p}</td><td class="name">${r.f}</td><td class="name">${r.a||'—'}</td>
        <td><span class="voc-tag" style="background:var(--ov)">${r.vc}</span></td>
        <td class="voc-text-cell">${r.v}</td>
      </tr>`).join('') || `<tr><td colspan="6" class="empty">查無符合條件的回饋</td></tr>`}</tbody>
    </table></div>
  `;
  document.getElementById('vocPager').innerHTML = `
    <button ${vocPage<=1?'disabled':''} id="vocPrev">上一頁</button>
    <span>共 ${rows.length} 筆｜第 ${vocPage}/${totalPages} 頁</span>
    <button ${vocPage>=totalPages?'disabled':''} id="vocNext">下一頁</button>
  `;
  const prev = document.getElementById('vocPrev'), next = document.getElementById('vocNext');
  if(prev) prev.addEventListener('click', ()=>{ vocPage--; drawVocTable(vocAll); });
  if(next) next.addEventListener('click', ()=>{ vocPage++; drawVocTable(vocAll); });
}

// ================= TAB 10: TREND INSIGHTS (趨勢洞察) =================
function splitTrend(monthsPresent, arrByMonth){
  // compare average of the earlier half of months vs the later half, for records within the current filter
  if(monthsPresent.length < 2) return null;
  const mid = Math.ceil(monthsPresent.length/2);
  const early = monthsPresent.slice(0, mid);
  const late = monthsPresent.slice(mid);
  const earlyArr = early.flatMap(m=>arrByMonth.get(m)||[]);
  const lateArr = late.flatMap(m=>arrByMonth.get(m)||[]);
  const earlyAvg = mean(earlyArr,'g'), lateAvg = mean(lateArr,'g');
  if(earlyAvg==null || lateAvg==null) return null;
  return { earlyAvg, lateAvg, delta: lateAvg-earlyAvg, earlyLabel:fmtYM2(early[0])+'~'+fmtYM2(early[early.length-1]), lateLabel:fmtYM2(late[0])+'~'+fmtYM2(late[late.length-1]) };
}
function trendTag(delta){
  if(delta==null) return {icon:'▪️', word:'資料不足', cls:'flat'};
  if(delta >= 0.01) return {icon:'🔺', word:'上升', cls:'up'};
  if(delta <= -0.01) return {icon:'🔻', word:'下滑', cls:'down'};
  return {icon:'➖', word:'持平', cls:'flat'};
}
function priorityBadge(avg, count){
  if(count < 20) return {label:'樣本偏少', cls:'pill warn'};
  if(avg==null) return {label:'—', cls:'pill'};
  if(avg < 4.85) return {label:'🔴 優先關注', cls:'pill bad'};
  if(avg < 4.95) return {label:'🟡 持續追蹤', cls:'pill warn'};
  return {label:'🟢 穩定', cls:'pill good'};
}

        共有 <b class="down">${declining.length}</b> 廠呈現下滑趨勢、<b class="up">${improving.length}</b> 廠呈現上升趨勢；
        另有 <b class="score-bad">${priorityPlants.length}</b> 廠均總分低於 4.95，列入優先關注名單。

const offCtl = { metric:'csi', rankPeriod:'m:last', rankBy:'csi' };
function rawRange(lists, step){
  let mn=Infinity, mx=-Infinity;
  lists.forEach(a=>a.forEach(v=>{ if(v!=null){ if(v<mn) mn=v; if(v>mx) mx=v; } }));
  if(!isFinite(mn)) return {min:0,max:100};
  return {min: Math.floor((mn-step*0.3)/step)*step, max: Math.ceil((mx+step*0.1)/step)*step};
}
function offHeat(v, metric){
  if(v==null) return '';
  const hi = metric==='csi' ? 975 : 0.97, mid = metric==='csi' ? 950 : 0.93;
  if(v>=hi) return 'background:var(--good-bg);color:var(--good);';
  if(v>=mid) return 'background:var(--warn-bg);color:var(--warn);';
  return 'background:var(--bad-bg);color:var(--bad);';
}

    const fmt = v => v==null ? '<span style="color:var(--muted)">—</span>' : (metric==='csi' ? v.toFixed(1) : (v*100).toFixed(1)+'%');
    const row = (name, arr, strong, sub)=>`<tr${strong?' style="background:var(--strong-bg);font-weight:800;"':''}>
      <td class="name" style="position:sticky;left:0;background:var(--card);z-index:1;">${name}${sub?`<span style="color:var(--muted);font-weight:400;font-size:10.5px;"> ${sub}</span>`:''}</td>
      ${arr.map((v,i)=>`<td style="${offHeat(v,metric)}" title="${name} ${fmtYM(months[i])}">${fmt(v)}</td>`).join('')}</tr>`;
    let body = '';
    const showAgg = state.dealer==='all' && state.plant==='all';
    if(showAgg) body += row('ES整體', es[metric], true);
    ['新北區','台北區'].forEach(rg=>{
      const ps = plants.filter(p=>p.region===rg);
      if(!ps.length) return;
      if(showAgg) body += row(rg, O.regions[rg][metric], true);
      ps.forEach(p=> body += row(p.name, p[metric], false, p.dealer));
    });
    document.getElementById('offMatrix').innerHTML = `<div class="tablewrap" style="max-height:600px;overflow:auto;"><table>
      <thead><tr><th style="left:0;z-index:2;">廠區</th>${months.map(m=>`<th>${fmtYM2(m)}</th>`).join('')}</tr></thead>
      <tbody>${body}</tbody></table></div>
      <div class="threshold-note" style="margin-top:8px;">顏色：${metric==='csi'?'≥975 綠、950–975 黃、<950 紅':'≥97% 綠、93–97% 黃、<93% 紅'}（顯示用門檻，非官方目標）；「—」表示該月無成績。</div>`;
  };
  document.getElementById('offMetric').addEventListener('change', e=>{ offCtl.metric = e.target.value; drawMatrix(); });
  drawMatrix();
}

// ================= INIT =================
function applyThemeUi(){
  const t = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent = t==='light' ? '🌙 深色' : '☀️ 淺色';
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const next = document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('csi-theme', next); }catch(e){}
  loadPalette(); applyThemeUi();
  const t = TABS.find(t=>t.id===currentTab); if(t) t.render();
});
applyThemeUi();
buildNav();
buildFilterBar();
renderHeader();
switchTab('overview');

};
</script>
<script>
/* ================================================================
   帳號登入（沿用「戰情大表」的 Supabase 帳號系統：帳號/密碼/停用狀態都在伺服器端驗證）
   - 不使用 SDK/CDN，直接呼叫 Supabase REST；金鑰是公開的 publishable key（本來就會出現在網頁裡）
   - 帳號 → 內部 email：<帳號小寫>@yuxin.internal；使用者資料表 app_users（status=active 才放行）
   - 首次登入（must_change_password）強制改密碼；閒置 30 分鐘自動登出；登入/登出寫入 log-event 稽核
   - 登入成功「之後」才載入 records.js / official.js 並啟動儀表板
   ================================================================ */
(function(){
"use strict";
var SB_URL = 'https://lhkdnfrareofawkdmunz.supabase.co';
var SB_KEY = 'sb_publishable_eSEri2_WtVda1a7BbzZzgg_2BpFZJDu';
var SKEY = 'csi-auth-session-v1';
var IDLE_MIN = 30;           // 閒置幾分鐘自動登出
var session = null, user = null, idleTimer = null, refreshTimer = null, started = false;

function $(id){ return document.getElementById(id); }
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function(k){
    if (k === 'class') n.className = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){ n.appendChild(c); });
  return n;
}
function toEmail(a){ return String(a).trim().toLowerCase() + '@yuxin.internal'; }
function now(){ return Math.floor(Date.now() / 1000); }
function saveSession(s){ try{ if (s) localStorage.setItem(SKEY, JSON.stringify(s)); else localStorage.removeItem(SKEY); }catch(e){} }
function readSession(){ try{ return JSON.parse(localStorage.getItem(SKEY) || 'null'); }catch(e){ return null; } }

function api(path, opt){
  opt = opt || {};
  var headers = {apikey: SB_KEY};
  if (opt.json !== undefined) headers['Content-Type'] = 'application/json';
  if (opt.token) headers.Authorization = 'Bearer ' + opt.token;
  return fetch(SB_URL + path, {
    method: opt.method || 'GET', headers: headers,
    body: opt.json !== undefined ? JSON.stringify(opt.json) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
      return {ok: r.ok, status: r.status, json: j};
    });
  });
}
function setSession(j){
  session = {
    access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || (now() + (j.expires_in || 3600)),
    uid: (j.user && j.user.id) || (session && session.uid) || null
  };
  saveSession(session);
}
function signIn(account, pw){
  return api('/auth/v1/token?grant_type=password', {method:'POST', json:{email: toEmail(account), password: pw}}).then(function(r){
    if (!r.ok || !r.json || !r.json.access_token) throw new Error('bad credentials');
    setSession(r.json);
  });
}
function refresh(){
  return api('/auth/v1/token?grant_type=refresh_token', {method:'POST', json:{refresh_token: session.refresh_token}}).then(function(r){
    if (!r.ok || !r.json || !r.json.access_token) throw new Error('refresh failed');
    setSession(r.json);
  });
}
function ensureFresh(){
  if (!session) return Promise.reject(new Error('no session'));
  return session.expires_at - now() < 120 ? refresh() : Promise.resolve();
}
function loadProfile(){
  return api('/rest/v1/app_users?id=eq.' + encodeURIComponent(session.uid) + '&select=*', {token: session.access_token}).then(function(r){
    return (r.ok && r.json && r.json[0]) ? r.json[0] : null;
  });
}
// 稽核紀錄：IP 由伺服器端 Edge Function 從請求取得，前端只傳事件種類與 user-agent
function logEvent(type, extra){
  var headers = {'Content-Type': 'application/json'};
  if (session) headers.Authorization = 'Bearer ' + session.access_token;
  return fetch(SB_URL + '/functions/v1/log-event', {
    method: 'POST', headers: headers,
    body: JSON.stringify(Object.assign({type: type, user_agent: navigator.userAgent}, extra || {}))
  }).catch(function(){});
}

/* ---------- UI ---------- */
function gate(){ return $('authGate'); }
function openGate(){ gate().style.display = 'flex'; }
function closeGate(){ gate().style.display = 'none'; clearNode(gate()); }
function clearNode(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function titleBlock(sub){
  return el('div', {class:'auth-head'}, [
    el('div', {class:'auth-logo', text:'📡'}),
    el('div', {class:'auth-title', text:'CSI 服務戰情系統'}),
    el('div', {class:'auth-sub', text: sub || '裕信汽車服務部'})
  ]);
}
function input(type, ph, ac){
  return el('input', {type: type, placeholder: ph, autocomplete: ac, class:'auth-input'});
}

function showLogin(message){
  $('appRoot').style.display = 'none';
  var g = gate(); clearNode(g); openGate();
  var acc = input('text', '帳號', 'username'), pw = input('password', '密碼', 'current-password');
  var err = el('div', {class:'auth-err', text: message || ''});
  var btn = el('button', {type:'submit', class:'auth-btn', text:'登入'});
  var form = el('form', {class:'auth-box'}, [
    titleBlock(), acc, pw, err, btn,
    el('div', {class:'auth-note', text:'使用與「營運績效戰情中心」相同的帳號密碼。登入後才會載入資料。'})
  ]);
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var a = acc.value.trim(), p = pw.value;
    if (!a || !p){ err.textContent = '請輸入帳號與密碼'; return; }
    btn.disabled = true; btn.textContent = '登入中...'; err.textContent = '';
    signIn(a, p).then(loadProfile).then(function(profile){
      if (!profile){ throw new Error('noprofile'); }
      if (profile.status !== 'active'){ throw new Error('disabled'); }
      logEvent('login_success');
      afterAuth(profile);
    }).catch(function(ex){
      var m = ex && ex.message;
      if (m === 'disabled'){ err.textContent = '此帳號已被停用，請聯絡管理員'; sessionEnd(); }
      else if (m === 'noprofile'){ err.textContent = '找不到帳號資料，請聯絡管理員'; sessionEnd(); }
      else { err.textContent = '帳號或密碼錯誤'; logEvent('login_fail', {account: a}); }
      btn.disabled = false; btn.textContent = '登入';
    });
  });
  g.appendChild(form);
  acc.focus();
}

function showChangePassword(forced){
  var g = gate(); clearNode(g); openGate();
  var cur = input('password', '目前密碼', 'current-password');
  var n1 = input('password', '新密碼（至少6碼）', 'new-password');
  var n2 = input('password', '再輸入一次新密碼', 'new-password');
  var err = el('div', {class:'auth-err'});
  var btn = el('button', {type:'submit', class:'auth-btn', text:'更新密碼'});
  var kids = [titleBlock(forced ? '首次登入，請先設定新密碼' : '修改密碼')];
  if (forced) kids.push(el('div', {class:'auth-warn', text:'⚠️ 您的帳號目前使用初始／臨時密碼，請先改成自己的密碼才能使用。'}));
  kids.push(cur, n1, n2, err, btn);
  if (!forced){
    var cancel = el('button', {type:'button', class:'auth-cancel', text:'取消'});
    cancel.addEventListener('click', closeGate);
    kids.push(cancel);
  }
  var form = el('form', {class:'auth-box'}, kids);
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (!cur.value || !n1.value){ err.textContent = '請完整輸入'; return; }
    if (n1.value.length < 6){ err.textContent = '新密碼至少需要6碼'; return; }
    if (n1.value !== n2.value){ err.textContent = '兩次輸入的新密碼不一致'; return; }
    if (n1.value === cur.value){ err.textContent = '新密碼不可與目前密碼相同'; return; }
    btn.disabled = true; err.textContent = '';
    signIn(user.account, cur.value).then(function(){
      return api('/auth/v1/user', {method:'PUT', token: session.access_token, json:{password: n1.value}});
    }).then(function(r){
      if (!r.ok) throw new Error((r.json && (r.json.msg || r.json.message)) || '更新失敗');
      return api('/rest/v1/rpc/log_password_changed', {method:'POST', token: session.access_token, json:{}});
    }).then(function(r){
      if (!r.ok) throw new Error('更新失敗，請聯絡管理員');
      return loadProfile();
    }).then(function(profile){
      user = profile || user;
      closeGate();
      if (forced) enter(); else renderUserMenu();
    }).catch(function(ex){
      err.textContent = (ex && ex.message === 'bad credentials') ? '目前密碼不正確' : ((ex && ex.message) || '更新失敗');
      btn.disabled = false;
    });
  });
  g.appendChild(form);
  cur.focus();
}

function renderUserMenu(){
  var m = $('userMenu'); if (!m || !user) return;
  clearNode(m);
  m.appendChild(el('span', {class:'user-chip', text: (user.name || user.account) + '（' + user.account + '）'}));
  var pwb = el('button', {class:'theme-btn', type:'button', text:'改密碼'});
  pwb.addEventListener('click', function(){ showChangePassword(false); });
  var out = el('button', {class:'theme-btn', type:'button', text:'登出'});
  out.addEventListener('click', function(){ logout(); });
  m.appendChild(pwb); m.appendChild(out);
}

/* ---------- 流程 ---------- */
function loadScript(src, optional){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = src + '?v=' + Math.floor(Date.now() / 300000);
    s.onload = resolve;
    s.onerror = function(){ optional ? resolve() : reject(new Error('載入失敗：' + src)); };
    document.head.appendChild(s);
  });
}
function afterAuth(profile){
  user = profile;
  if (user.must_change_password) showChangePassword(true); else enter();
}
function enter(){
  closeGate();
  var load = started ? Promise.resolve() : loadScript('records.js').then(function(){ return loadScript('official.js', true); });
  load.then(function(){
    if (!started){ started = true; $('appRoot').style.display = 'block'; window.__csiStart(); }
    else $('appRoot').style.display = 'block';
    renderUserMenu();
    resetIdle();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function(){
      refresh().catch(function(){ logout('expired'); });
    }, 20 * 60 * 1000);
  }).catch(function(ex){
    showLogin('資料載入失敗，請稍後再試（' + ex.message + '）');
  });
}
function resetIdle(){
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ logout('idle'); }, IDLE_MIN * 60 * 1000);
}
['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function(evt){
  document.addEventListener(evt, function(){ if (user && started) resetIdle(); }, {passive: true});
});
function sessionEnd(){
  var tok = session && session.access_token;
  session = null; saveSession(null);
  if (!tok) return Promise.resolve();
  try{ return api('/auth/v1/logout', {method:'POST', token: tok}).catch(function(){}); }catch(e){ return Promise.resolve(); }
}
function logout(reason){
  var done = user ? logEvent('logout') : Promise.resolve();
  Promise.resolve(done).then(sessionEnd).catch(function(){}).then(function(){
    try{
      if (reason === 'idle') sessionStorage.setItem('csi-auth-msg', '閒置過久，已自動登出，請重新登入。');
      else if (reason === 'expired') sessionStorage.setItem('csi-auth-msg', '登入已逾時，請重新登入。');
    }catch(e){}
    location.reload();   // 重新載入頁面，確保記憶體中的資料一併清除
  });
}

function boot(){
  var msg = null;
  try{ msg = sessionStorage.getItem('csi-auth-msg'); sessionStorage.removeItem('csi-auth-msg'); }catch(e){}
  session = readSession();
  if (!session || !session.refresh_token){ showLogin(msg); return; }
  ensureFresh().then(loadProfile).then(function(profile){
    if (profile && profile.status === 'active') afterAuth(profile);
    else { sessionEnd(); showLogin(profile ? '此帳號已被停用，請聯絡管理員。' : msg); }
  }).catch(function(){ session = null; saveSession(null); showLogin(msg); });
}
document.addEventListener('DOMContentLoaded', boot);
})();

</script>
